name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source and scripts
        run: |
          python -m compileall -q main.py doctor.py src tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python main.py --version | grep -Eq '^DualCPY macOS [0-9]+\.[0-9]+\.[0-9]+$'
          zsh -n install.command run.command scripts/*.sh

      - name: Build macOS application
        run: python build.py

      - name: Verify application bundle
        run: |
          codesign --verify --deep --strict "dist/DualCPY macOS.app"
          plutil -lint "dist/DualCPY macOS.app/Contents/Info.plist"

      - name: Package CI artifact
        run: ./scripts/package_release.sh ci-unsigned

      - uses: actions/upload-artifact@v7
        with:
          name: dualcpy-macos-ci-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
